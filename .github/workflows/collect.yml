name: Index
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'probe or index', default: 'probe' }
permissions:
  contents: write
concurrency: { group: index, cancel-in-progress: false }
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      # The Gazette's server sends its own certificate only. Add the two Let's Encrypt certificates it names, so curl can check the chain.
      - name: Complete the certificate chain
        run: |
          cp /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/ca.pem"
          for u in http://yr1.i.lencr.org/ http://yr.i.lencr.org/; do curl -sL -m 20 "$u" | openssl x509 -inform der >> "$RUNNER_TEMP/ca.pem"; done
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/ca.pem" >> "$GITHUB_ENV"
      - name: Probe the Gazette
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: python3 -I collect.py probe
      - name: One capped run
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: python3 -I collect.py index 300
      - name: Save progress
        if: ${{ always() && github.event.inputs.mode != 'probe' }}
        run: |
          git config user.name "collector"; git config user.email "actions@github.com"
          git add catalogue.jsonl months_done.txt 2>/dev/null || true
          git commit -qm "Progress $(date -u +%F)" && git push -q || echo "nothing new"
