name: Index
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'probe or index', default: 'probe' }
permissions:
  contents: write
concurrency: { group: index, cancel-in-progress: false }
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Probe the Gazette
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: |
          curl -s -m 15 https://ipinfo.io/json | grep -E '"(ip|country|region|org)"' || true
          for u in https://egazette.gov.in/ https://www.legislative.gov.in/ https://www.google.com/; do
            curl -s -o /dev/null -m 25 -w "$u http=%{http_code} ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n" "$u" || echo "$u failed exit $?"
          done
          getent hosts egazette.gov.in || true
      - name: One capped run
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: python3 -I collect.py index 300
      - name: Save progress
        if: ${{ always() && github.event.inputs.mode != 'probe' }}
        run: |
          git config user.name "collector"; git config user.email "actions@github.com"
          git add catalogue.jsonl months_done.txt 2>/dev/null || true
          git commit -qm "Progress $(date -u +%F)" && git push -q || echo "nothing new"
